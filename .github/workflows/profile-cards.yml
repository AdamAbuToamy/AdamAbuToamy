name: Build profile project GIF cards
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_cards.py"
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - run: python scripts/build_profile_cards.py
      - name: Commit actual-media composite GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-v3/*.gif
          if ! git diff --cached --quiet; then
            git commit -m "assets: render original project media into dark GIF cards"
            git push
          fi
