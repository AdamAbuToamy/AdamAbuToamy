name: Refresh 3D contribution calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-3d.yml'
      - 'README.md'
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate real 3D GitHub contributions
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: AdamAbuToamy
      - name: Focus 3D scene on the most recent sixteen weeks
        run: python3 scripts/refresh_recent_3d.py
      - name: Publish generated graphics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh authentic 3D contribution graphics"
            git push
          fi
