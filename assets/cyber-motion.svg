<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="Animated cyber telemetry banner; decorative visualization, not GitHub contribution data">
<defs><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#101e31"/><stop offset="1" stop-color="#071420"/></linearGradient><linearGradient id="neon"><stop stop-color="#26f9c8"/><stop offset=".5" stop-color="#50cfff"/><stop offset="1" stop-color="#a38aff"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#205063" stroke-opacity=".22" fill="none"/></pattern><clipPath id="clip"><rect x="4" y="4" width="1192" height="160" rx="20"/></clipPath></defs>
<rect x="3" y="3" width="1194" height="162" rx="22" fill="url(#bg)" stroke="#3bd9d7" stroke-opacity=".7" stroke-width="2"/><g clip-path="url(#clip)"><rect width="1200" height="168" fill="url(#grid)"/>
<rect x="-300" y="3" width="250" height="162" fill="#35e9dc" opacity=".07"><animate attributeName="x" from="-300" to="1300" dur="6s" repeatCount="indefinite"/></rect>
<path d="M0 125H130L160 125L182 76L210 143L242 103L270 125H455L485 125L512 89L538 140L568 113L589 125H1200" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".8" stroke-dasharray="19 7"><animate attributeName="stroke-dashoffset" from="0" to="-130" dur="8s" repeatCount="indefinite"/></path>
<g fill="#36f8d4"><circle cx="85" cy="50" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="112" cy="50" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" begin=".4s" repeatCount="indefinite"/></circle><circle cx="139" cy="50" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" begin=".8s" repeatCount="indefinite"/></circle></g>
<text x="600" y="65" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" letter-spacing="4" fill="#f2faff">BUILDING SYSTEMS</text>
<text x="600" y="95" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="4" fill="#6eeed8">SOFTWARE  /  AUTOMATION  /  HARDWARE</text>
<path d="M735 125h300" stroke="#2ef4cf" stroke-opacity=".4" stroke-width="2"><animate attributeName="stroke-opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></path>
</g></svg>